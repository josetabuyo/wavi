[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavi-lib"
version = "0.2.3"
description = "WhatsApp automation via vision: screenshot → OCR → click"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "José Tabuyo", email = "josetabuyo@gmail.com"},
]
keywords = ["whatsapp", "automation", "vision", "ocr", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.40",
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "click>=8.1",
    "groq>=0.11",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/josetabuyo/wavi"
Source = "https://github.com/josetabuyo/wavi"
Issues = "https://github.com/josetabuyo/wavi/issues"

[project.scripts]
wavi = "wavi.cli:main"

# Keep in sync with [dependency-groups].dev — pip uses this extra
# (make install-dev), uv sync uses the dependency group.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
    "httpx>=0.27",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["wavi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: golden-screenshot vision eval (slow, real OCR, gated by WAVI_CORPUS=1)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length — long JS constants and comments are fine
]
